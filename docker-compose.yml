services:
  app:
    build: .
    ports:
      - "8000:10000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: gestion_reservas
      DB_USER: reservas
      DB_PASSWORD: reservas_local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gestion_reservas
      MYSQL_USER: reservas
      MYSQL_PASSWORD: reservas_local
      MYSQL_ROOT_PASSWORD: root_local
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
